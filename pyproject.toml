[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer - Artefact)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pypdf>=5.0",
]

[project.scripts]
emporio = "emporio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
